<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hax — map viewer</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="dot"></span>
      <strong id="title">Map</strong>
      <span id="meta" class="muted"></span>
    </div>
    <div class="topright">
      <label class="muted">export
        <select id="dpi" title="Image scale / DPI">
          <option value="1">1×</option>
          <option value="2" selected>2×</option>
          <option value="3">3×</option>
          <option value="4">4×</option>
        </select>
      </label>
      <label class="muted"><input id="transparent" type="checkbox" /> transparent</label>
      <span id="status" class="status" title="">Loading…</span>
    </div>
  </header>

  <main class="split">
    <section class="pane" id="volPane">
      <div class="pane-head">
        <div class="pane-title">Map <span id="sel" class="muted"></span></div>
        <div class="toolbar">
          <label>render
            <select id="rendermode">
              <option value="surface" selected>Surface</option>
              <option value="mip">Volume · MIP</option>
              <option value="emission">Volume · glow</option>
              <option value="slices">Orthogonal slices</option>
            </select>
          </label>
          <label id="lightlbl">light <select id="light"><option value="standard" selected>standard</option><option value="smooth">smooth</option><option value="raytraced">ray traced</option></select></label>
          <label id="smoothlbl">smooth <input id="smooth" type="range" min="0" max="20" value="6" title="Surface mesh smoothing (Taubin iterations)" /></label>
          <span id="volctrls" style="display:none">
            <label>γ <input id="vgamma" type="range" min="0.3" max="3" step="0.1" value="1.4" title="Transfer-function gamma" /></label>
            <label>bright <input id="vbright" type="range" min="0.2" max="3" step="0.1" value="1.2" title="Brightness / opacity" /></label>
          </span>
          <span id="slicectrls" style="display:none">
            <label>map
              <select id="slicemap" title="Slice colormap">
                <option value="gray" selected>gray</option>
                <option value="viridis">viridis</option>
                <option value="magma">magma</option>
                <option value="inferno">inferno</option>
                <option value="hot">hot</option>
              </select>
            </label>
            <label>low <input id="slicelo" type="range" min="0" max="1" step="0.01" value="0" title="Contrast — black point" /></label>
            <label>high <input id="slicehi" type="range" min="0" max="1" step="0.01" value="1" title="Contrast — white point" /></label>
            <label><input id="slicecross" type="checkbox" checked /> crosshair</label>
            <button id="sliceReset" class="btn" title="Reset slice zoom / pan (mouse wheel zooms)">Reset zoom</button>
          </span>
          <label id="colorlbl">surface <input id="color" type="color" value="#dcdcdc" title="Surface / volume color" /></label>
          <label>bg <input id="bg" type="color" value="#040610" title="Background color" /></label>
          <button id="reset" class="btn">Reset view</button>
          <button id="saveMap" class="btn" title="Save the current view as PNG">Save PNG</button>
          <button id="mrc" class="btn" title="Download this map as .mrc">.mrc</button>
        </div>
      </div>
      <div class="hist-strip" id="histStrip">
        <span class="hist-label muted">contour</span>
        <canvas id="hist"></canvas>
      </div>
      <!-- Canvas + model rail side by side, ChimeraX-style: the rail costs width, which
           there is plenty of, rather than height, which the map needs. -->
      <div class="stage" id="stage">
        <!-- The rim gesture has no cursor of its own (ChimeraX has none either), so the
             tooltip is the only place it is discoverable. -->
        <div class="canvas-wrap"
             title="Drag to rotate · drag near the edge to spin in-plane · middle-drag to pan · wheel to zoom">
          <canvas id="gl"></canvas>
          <canvas id="glvol" style="display:none"></canvas>
          <div id="slices" class="slices" style="display:none"></div>
          <!-- Reopens the rail once collapsed; the rail itself is gone by then. -->
          <button id="modelsReopen" class="models-reopen" title="Show the model panel" hidden>Models</button>
        </div>
        <div class="rail-resize" id="modelsResize"></div>
        <!-- Hidden entirely for a single map: a list of one is just noise, and a lone
             map is what this viewer has always shown. -->
        <aside class="models" id="models" hidden>
          <div class="models-head">
            <span class="models-title">Models</span>
            <button id="modelsAll" class="lnk" title="Show every map">all</button>
            <button id="modelsNone" class="lnk" title="Hide every map">none</button>
            <button id="modelsCollapse" class="iconbtn" title="Hide the model panel">×</button>
          </div>
          <div class="models-list" id="modelsList"></div>
        </aside>
      </div>
      <!-- Morph strip. Below the canvas rather than in the rail: a scrubber wants width,
           and the rail is deliberately narrow. Shown only when the maps share a grid. -->
      <div class="morph" id="morph" hidden>
        <span class="morph-title">Morph</span>
        <span id="morphSeq" class="morph-seq muted">pick maps in the panel →</span>
        <label>frames <input id="morphFrames" type="number" min="2" max="120" value="24" title="Interpolated frames between each pair of maps" /></label>
        <label title="Contour every frame at the same enclosed mass instead of the same sigma. Averaging two maps lowers the variance, so a fixed sigma makes the surface breathe mid-morph."><input id="morphMass" type="checkbox" checked /> constant mass</label>
        <label>quality
          <select id="morphQuality" title="Draft prepares in seconds; full is slower to prepare but is what you want in a recording">
            <option value="draft" selected>draft</option>
            <option value="full">full</option>
          </select>
        </label>
        <button id="morphPrepare" class="btn" title="Compute the frames">Prepare</button>
        <button id="morphPlay" class="btn" disabled>▶</button>
        <input id="morphScrub" type="range" min="0" max="0" value="0" disabled title="Scrub through the morph" />
        <label>fps <input id="morphFps" type="number" min="1" max="60" value="30" /></label>
        <button id="morphRecord" class="btn" disabled title="Play once and save it as a video">● Record</button>
        <button id="morphClear" class="lnk" title="Clear the morph and go back to the maps">clear</button>
      </div>
    </section>
  </main>

  <script type="module" src="./mrc.js"></script>
</body>
</html>

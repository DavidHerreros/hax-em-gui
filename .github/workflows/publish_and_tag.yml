name: publish to pypi and tag

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check version
        # PyPI rejects re-uploads, so only publish when __version__ was bumped.
        id: version
        run: |
          VERSION=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' backend/hax_gui/__init__.py)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if curl -sf "https://pypi.org/pypi/hax-em-gui/$VERSION/json" > /dev/null; then
            echo "hax-em-gui $VERSION is already on PyPI, skipping"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build package
        if: steps.version.outputs.publish == 'true'
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*

      - name: Publish to PyPI
        if: steps.version.outputs.publish == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          print-hash: true

      - name: Tag release
        if: steps.version.outputs.publish == 'true'
        run: |
          TAG=v${{ steps.version.outputs.version }}
          git tag "$TAG"
          git push origin "$TAG"

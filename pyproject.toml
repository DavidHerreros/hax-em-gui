[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "hax-em-gui"
description = "Web GUI for the hax-em CryoEM heterogeneity suite: program launcher, job manager, and a browser-native WebGL conformational-landscape viewer."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
dynamic = ["version"]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "websockets>=12",
    "pydantic>=2",
    "httpx>=0.27",
]

[project.scripts]
hax-gui = "hax_gui.cli:main"

[tool.setuptools.dynamic]
version = { attr = "hax_gui.__version__" }

# The importable package lives under backend/; the SPA (frontend/) and the
# WebGL viewer (viewer/) are served from their source locations, so an editable
# install (`pip install -e .`) is the supported install method.
[tool.setuptools]
package-dir = { "" = "backend" }

[tool.setuptools.packages.find]
where = ["backend"]
include = ["hax_gui*"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hax-em-gui"
description = "Web GUI for the hax-em CryoEM heterogeneity suite: program launcher, job manager, and a browser-native WebGL conformational-landscape viewer."
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
dynamic = ["version"]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "websockets>=12",
    "pydantic>=2",
    "httpx>=0.27",
]

[project.scripts]
hax-gui = "hax_gui.cli:main"

[tool.setuptools.dynamic]
version = { attr = "hax_gui.__version__" }

# The importable package lives under backend/hax_gui. The SPA (frontend/), the
# WebGL viewer (viewer_app/) and the seed schema cache (schemas_cache/) are
# bundled inside the package as data, so editable, wheel and PyPI installs all
# resolve them via __file__-relative paths.
[tool.setuptools]
package-dir = { "" = "backend" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["backend"]
include = ["hax_gui*"]

[tool.setuptools.package-data]
hax_gui = [
    "frontend/*", "frontend/**/*",
    "viewer_app/*", "viewer_app/**/*",
    "schemas_cache/*.json",
]
